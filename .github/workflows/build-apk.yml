name: Build Jumura APK

# Compile l'APK à chaque push (et manuellement via l'onglet "Actions"),
# puis publie une "Release" GitHub que l'app utilise pour se mettre à jour.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > local.properties

      - run: gradle assembleDebug --no-daemon --stacktrace

      # Récupère le versionCode pour nommer la Release (v1, v2, v3...)
      - id: ver
        run: echo "code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jumura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publie/actualise la Release "vX" avec l'APK (source de la mise à jour intégrée)
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: Jumura v${{ steps.ver.outputs.code }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
